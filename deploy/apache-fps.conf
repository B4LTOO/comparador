# Sitio de Apache2 para el comparador. Copiar a /etc/apache2/sites-available/fps.conf
#   sudo a2enmod headers
#   sudo a2dissite 000-default && sudo a2ensite fps
#   sudo systemctl reload apache2
<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/comparador-fps/public

    <Directory /var/www/comparador-fps/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/fps-error.log
    CustomLog ${APACHE_LOG_DIR}/fps-access.log combined
</VirtualHost>
